name: CI

# Quality gates for the trading worker + dashboard. Runs on every push and PR.
# These mirror the local `npm run verify` gate (worker typecheck + test typecheck + full suite),
# so a green PR is provably type-consistent across src/ AND tests/ — the latter was historically
# unchecked, which let test config literals drift from the real AppConfig shape.

on:
  push:
    branches: [main, hostinger-exact-share-readiness]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 22.x supports `node --test --test-isolation=none` (the test script); 20.x does not
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck worker (src/)
        run: npm run build:worker

      - name: Typecheck tests (tsconfig.tests.json)
        run: npm run typecheck:test

      - name: Run test suite
        run: npm test

  format:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 22.x supports `node --test --test-isolation=none` (the test script); 20.x does not
      - run: npx --yes prettier@3.4.2 --check .
